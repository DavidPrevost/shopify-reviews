<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background:#f6f6f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width:560px; background:{{ cardBackground }}; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <tr><td style="padding:32px 32px 16px;">
          {{ body }}
        </td></tr>

        <tr><td style="padding:16px 32px; border-top:1px solid #eaeaea; background:#fafafa; border-radius:0 0 8px 8px;">
          {{ footerHtml }}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
