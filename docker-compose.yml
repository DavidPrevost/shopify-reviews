# Stack for Mercury — /opt/stacks/shopify-reviews-{dev,prod}/
# Public ingress is handled by a GCP Always-Free relay (Caddy + Tailscale)
# rather than cloudflared inside this compose. The relay reaches Mercury via
# its Tailscale IP, so we bind the app's port to that interface specifically
# (not 0.0.0.0) — keeps the app off Mercury's LAN-facing interfaces.

services:
  reviews-app:
    build: .
    container_name: ${REVIEWS_CONTAINER_NAME:-reviews-app}
    restart: unless-stopped
    env_file: .env
    volumes:
      # Mount the host's ./data at /app/data inside the container — that's
      # where config.dataDir resolves to since WORKDIR is /app. The SQLite
      # file lives at /app/data/reviews.db; binding here makes it persist
      # across rebuilds.
      - ./data:/app/data
    ports:
      # HOST_BIND_IP should be Mercury's Tailscale IP (100.x.y.z).
      # HOST_PORT is 8070 for prod, 8071 for dev (maps to internal 8080).
      - "${HOST_BIND_IP}:${HOST_PORT}:8080"
    networks:
      - reviews-net

  backup:
    image: alpine:latest
    container_name: ${REVIEWS_BACKUP_CONTAINER_NAME:-reviews-backup}
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
      - /root/.ssh:/root/.ssh:ro
    environment:
      TZ: America/New_York
    command: >
      sh -c "apk add --no-cache rsync openssh-client sqlite tzdata &&
             echo '0 3 * * * sh /scripts/backup.sh >> /data/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -d 8"

networks:
  reviews-net:
    driver: bridge
