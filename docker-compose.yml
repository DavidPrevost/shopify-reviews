# Stack for Mercury — /opt/stacks/shopify-reviews-{dev,prod}/
# Public ingress is handled by an Oracle Cloud relay (Caddy + Tailscale)
# rather than cloudflared inside this compose. The relay reaches Mercury via
# its Tailscale IP, so we bind the app's port to that interface specifically
# (not 0.0.0.0) — keeps the app off Mercury's LAN-facing interfaces.

services:
  reviews-app:
    build: .
    container_name: reviews-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      # HOST_BIND_IP should be Mercury's Tailscale IP (100.x.y.z).
      # HOST_PORT is 8080 for prod, 8081 for dev.
      - "${HOST_BIND_IP}:${HOST_PORT}:8080"
    networks:
      - reviews-net

  backup:
    image: alpine:latest
    container_name: reviews-backup
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
      - /root/.ssh:/root/.ssh:ro
    environment:
      TZ: America/New_York
    command: >
      sh -c "apk add --no-cache rsync openssh-client sqlite tzdata &&
             echo '0 3 * * * sh /scripts/backup.sh >> /data/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -d 8"

networks:
  reviews-net:
    driver: bridge
